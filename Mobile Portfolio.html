<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Portfolio — Avigail Bahat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #e8e8e8;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
}

#root {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 32px;
  padding: 40px;
  min-height: 100vh;
  background: #e8e8e8;
}

/* iPhone frame */
.iphone-frame {
  width: 390px;
  height: 844px;
  border-radius: 50px;
  border: 6px solid #1a1a1a;
  box-shadow:
    0 0 0 1px #333,
    0 30px 80px rgba(0,0,0,0.4),
    0 10px 30px rgba(0,0,0,0.25);
  position: relative;
  flex-shrink: 0;
}

.iphone-screen {
  width: 100%;
  height: 100%;
  border-radius: 44px;
  overflow: hidden;
  position: relative;
  background: #fff;
}

.dynamic-island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 34px;
  background: #000;
  border-radius: 17px;
  z-index: 200;
}

.home-indicator {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  background: rgba(0,0,0,0.2);
  border-radius: 3px;
  z-index: 200;
}

/* Mob app root */
.mob {
  --ac: #0a0a0a;
  --gray: #555;
  --border: #ebebeb;
  --surface: #f5f5f5;
  --pad: 20px;
  --tw-accent: #2b6cff;
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #fff;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 44px;
  overflow: hidden;
}

.mob button { all: unset; cursor: pointer; }
.mob a { color: inherit; text-decoration: none; }

/* Scrollable page container */
.mob-page {
  position: absolute;
  top: 58px; /* below dynamic island */
  left: 0; right: 0;
  bottom: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

/* Header */
.mob-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: padding 0.2s ease, border-color 0.2s ease;
  padding: 14px var(--pad) 14px;
  border-bottom: 0.5px solid transparent;
}

.mob-header.condensed {
  padding: 10px var(--pad);
  border-bottom-color: var(--border);
}

.mob-header-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.mob-logo-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--ac);
  display: block;
  line-height: 1.2;
}

.mob-logo-role {
  font-size: 12px;
  color: var(--gray);
  max-height: 18px;
  opacity: 1;
  overflow: hidden;
  transition: max-height 0.2s ease, opacity 0.2s ease;
  line-height: 1.4;
  margin-top: 2px;
}

.mob-header.condensed .mob-logo-role {
  max-height: 0;
  opacity: 0;
}

.mob-hamburger {
  width: 38px;
  height: 38px;
  border: 0.5px solid var(--border);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: #fff;
}

.mob-hamburger span {
  display: block;
  width: 16px;
  height: 1.5px;
  background: var(--ac);
  border-radius: 1px;
}

.mob-progress-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 2px;
  background: var(--tw-accent);
  transition: width 0.1s linear;
}

/* Slide-in menu */
.mob-menu-scrim {
  position: absolute;
  inset: 0;
  background: rgba(10,10,10,0.32);
  z-index: 50;
  border-radius: 44px;
}

.mob-menu-panel {
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  width: 82%;
  background: #fff;
  z-index: 51;
  transform: translateX(100%);
  transition: transform 0.34s ease-out;
  display: flex;
  flex-direction: column;
  border-radius: 0 44px 44px 0;
  overflow: hidden;
}

.mob-menu-panel.open {
  transform: translateX(0);
}

.mob-menu-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 70px 24px 20px;
}

.mob-menu-close {
  width: 30px;
  height: 30px;
  border: 0.5px solid var(--border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--gray);
  background: #fff;
  flex-shrink: 0;
}

.mob-menu-nav {
  flex: 1;
  padding: 8px 24px;
  overflow-y: auto;
}

.mob-menu-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 24px;
  font-weight: 600;
  padding: 16px 0;
  border-bottom: 0.5px solid var(--border);
  color: #aaa;
  cursor: pointer;
  background: none;
  width: 100%;
  text-align: left;
}

.mob-menu-link.active {
  color: var(--ac);
}

.mob-menu-footer {
  padding: 20px 24px 40px;
  border-top: 0.5px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.mob-menu-footer a {
  font-size: 14px;
  color: var(--gray);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Lede */
.mob-lede {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 24px;
  font-weight: 500;
  color: var(--ac);
  line-height: 1.4;
  padding: 28px var(--pad) 24px;
}

/* Section label */
.mob-section-label {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--gray);
  padding: 0 var(--pad);
  margin-bottom: 0;
}

/* Featured cards */
.mob-feat-card {
  padding: 20px var(--pad);
  border-bottom: 0.5px solid var(--border);
  cursor: pointer;
  transition: background 0.15s ease;
}

.mob-feat-card:first-of-type {
  border-top: 0.5px solid var(--border);
  margin-top: 12px;
}

.mob-feat-card:active {
  background: #f7f7f7;
}

.mob-feat-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 36px;
  font-weight: 700;
  color: var(--ac);
  letter-spacing: -0.03em;
  line-height: 1.1;
}

.mob-feat-sub {
  font-size: 14px;
  color: var(--gray);
  margin-top: 8px;
  line-height: 1.4;
}

.mob-feat-btn {
  margin-top: 12px;
  font-size: 13px;
  color: var(--tw-accent);
  display: inline-flex;
  align-items: center;
}

.mob-feat-btn.outline {
  border: 0.5px solid var(--tw-accent);
  border-radius: 3px;
  padding: 5px 10px;
}

/* All work section */
.mob-work-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px var(--pad) 0;
}

.mob-filter-btn {
  font-size: 13px;
  color: var(--gray);
  border: 0.5px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  background: #fff;
  display: flex;
  align-items: center;
  gap: 4px;
  position: relative;
}

.mob-filter-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: #fff;
  border: 0.5px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  z-index: 30;
  min-width: 170px;
  overflow: hidden;
}

.mob-filter-option {
  display: block;
  width: 100%;
  text-align: left;
  font-size: 13px;
  padding: 12px 16px;
  background: none;
  color: var(--gray);
  border-bottom: 0.5px solid var(--border);
  cursor: pointer;
}

.mob-filter-option:last-child {
  border-bottom: none;
}

.mob-filter-option.active {
  color: var(--tw-accent);
  font-weight: 500;
}

/* Work rows */
.mob-rows {
  padding: 0 var(--pad);
  margin-top: 14px;
}

.mob-row {
  padding: 14px 0;
  border-bottom: 0.5px solid var(--border);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.mob-row:first-child {
  border-top: 0.5px solid var(--border);
}

.mob-row-top {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.mob-row-num {
  font-size: 12px;
  color: var(--gray);
  min-width: 22px;
  flex-shrink: 0;
  line-height: 1.4;
}

.mob-row-title {
  font-size: 16px;
  font-weight: 400;
  color: var(--ac);
  line-height: 1.3;
  flex: 1;
}

.mob-row-sub {
  font-size: 12px;
  color: var(--gray);
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-left: 32px;
}

.mob-row-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: 32px;
  margin-top: 2px;
}

.mob-cat-tag {
  font-size: 12px;
  color: var(--gray);
  border: 0.5px solid var(--border);
  border-radius: 3px;
  padding: 3px 8px;
  white-space: nowrap;
}

.mob-row-view {
  font-size: 13px;
  color: var(--tw-accent);
}

/* Project header */
.mob-proj-header {
  position: sticky;
  z-index: 35;
  background: rgba(255,255,255,0.95);
  transition: padding 0.2s ease, box-shadow 0.2s ease;
  padding: 16px var(--pad);
  border-bottom: 0.5px solid transparent;
}

.mob-proj-header.condensed {
  padding: 10px var(--pad);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  background: rgba(255,255,255,0.92);
  box-shadow: 0 1px 0 var(--border);
}

.mob-proj-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.mob-proj-nav-btn {
  border: 0.5px solid var(--border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  font-size: 18px;
  transition: width 0.2s ease, height 0.2s ease, font-size 0.2s ease;
  background: #fff;
  flex-shrink: 0;
  width: 32px;
  height: 32px;
}

.mob-proj-header.condensed .mob-proj-nav-btn {
  width: 26px;
  height: 26px;
  font-size: 14px;
}

.mob-proj-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--ac);
  letter-spacing: -0.02em;
  line-height: 1.1;
  flex: 1;
  transition: font-size 0.2s ease;
  min-width: 0;
}

.mob-proj-header.condensed .mob-proj-title {
  font-size: 18px;
}

.mob-proj-meta {
  font-size: 12px;
  color: var(--gray);
  margin-top: 8px;
  max-height: 32px;
  opacity: 1;
  overflow: hidden;
  transition: max-height 0.2s ease, opacity 0.2s ease, margin 0.2s ease;
}

.mob-proj-header.condensed .mob-proj-meta {
  max-height: 0;
  opacity: 0;
  margin-top: 0;
}

/* Project content */
.mob-proj-content {
  padding: 24px var(--pad) 0;
}

.mob-proj-intro {
  font-size: 16px;
  font-weight: 500;
  color: var(--ac);
  line-height: 1.6;
  margin-bottom: 28px;
  padding-bottom: 28px;
  border-bottom: 0.5px solid var(--border);
}

.mob-proj-h2 {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--ac);
  margin-bottom: 12px;
  margin-top: 28px;
}

.mob-proj-ul {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.mob-proj-ul li {
  font-size: 14px;
  color: var(--gray);
  line-height: 1.65;
  padding-left: 14px;
  position: relative;
}

.mob-proj-ul li::before {
  content: '–';
  position: absolute;
  left: 0;
  color: #bbb;
}

.mob-proj-p {
  font-size: 14px;
  color: var(--gray);
  line-height: 1.65;
}

.mob-proj-figure {
  margin: 20px 0;
}

.mob-proj-img {
  width: 100%;
  border-radius: 6px;
  display: block;
  background: var(--surface);
  cursor: pointer;
  transition: opacity 0.15s ease;
}

.mob-proj-img:active {
  opacity: 0.9;
}

.mob-proj-caption {
  font-size: 12px;
  color: var(--gray);
  margin-top: 6px;
  line-height: 1.4;
}

.mob-proj-bottom-line {
  font-size: 15px;
  color: #444;
  line-height: 1.7;
  font-style: italic;
  margin-top: 8px;
}

/* More work on project page */
.mob-more-work {
  padding: 32px var(--pad) 0;
}

.mob-back-link {
  font-size: 14px;
  color: var(--tw-accent);
  padding: 20px var(--pad) 0;
  display: block;
}

.mob-see-all {
  display: block;
  font-size: 14px;
  color: var(--tw-accent);
  padding: 20px 0 4px;
  cursor: pointer;
}

/* Bottom pager */
.mob-pager {
  position: sticky;
  bottom: 0;
  z-index: 20;
  height: 56px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 0.5px solid var(--border);
  display: flex;
  align-items: center;
}

.mob-pager-prev,
.mob-pager-next {
  flex: 1;
  display: flex;
  align-items: center;
  height: 100%;
  cursor: pointer;
  min-width: 0;
}

.mob-pager-prev {
  padding: 0 var(--pad);
  gap: 6px;
}

.mob-pager-next {
  padding: 0 var(--pad);
  gap: 6px;
  justify-content: flex-end;
  text-align: right;
}

.mob-pager-arrow {
  font-size: 18px;
  color: var(--gray);
  flex-shrink: 0;
}

.mob-pager-label {
  font-size: 14px;
  font-weight: 500;
  color: var(--ac);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.mob-pager-divider {
  width: 0.5px;
  height: 28px;
  background: var(--border);
  flex-shrink: 0;
}

/* Lightbox */
.mob-lightbox {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 44px;
  padding: 16px;
}

.mob-lightbox-img {
  max-width: 100%;
  max-height: 80%;
  border-radius: 4px;
  object-fit: contain;
}

.mob-lightbox-caption {
  font-size: 13px;
  color: rgba(255,255,255,0.7);
  text-align: center;
  margin-top: 12px;
  line-height: 1.4;
}

.mob-lightbox-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
}

.mob-lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
}

.mob-lightbox-nav.prev { left: 12px; }
.mob-lightbox-nav.next { right: 12px; }

/* Footer */
.mob-footer {
  background: #0a0a0a;
  padding: 32px var(--pad) 52px;
  margin-top: 40px;
}

.mob-footer-statement {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 22px;
  font-weight: 500;
  color: #fff;
  margin-bottom: 16px;
  line-height: 1.2;
}

.mob-footer-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 20px;
}

.mob-footer-tag {
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  border: 0.5px solid rgba(255,255,255,0.2);
  border-radius: 3px;
  padding: 4px 8px;
}

.mob-footer-links {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}

.mob-footer-link {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  background: none;
  text-align: left;
}

.mob-footer-copy {
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  line-height: 1.5;
}

/* About page */
.mob-about-content {
  padding: 24px var(--pad) 0;
}

.mob-about-bio {
  font-size: 17px;
  font-weight: 500;
  color: var(--ac);
  line-height: 1.6;
  margin-bottom: 28px;
  padding-bottom: 28px;
  border-bottom: 0.5px solid var(--border);
}

.mob-cv-section-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--gray);
  margin-bottom: 20px;
  margin-top: 28px;
}

.mob-cv-role {
  margin-bottom: 28px;
}

.mob-cv-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--ac);
  display: block;
  margin-bottom: 10px;
  line-height: 1.3;
}

.mob-cv-sub-roles {
  border-left: 1.5px solid var(--border);
  padding-left: 16px;
  margin-top: 10px;
}

.mob-cv-sub-role {
  margin-bottom: 18px;
}

.mob-cv-sub-role:last-child {
  margin-bottom: 0;
}

.mob-cv-years {
  font-size: 13px;
  font-weight: 600;
  color: var(--ac);
  display: block;
  margin-bottom: 4px;
}

.mob-cv-desc {
  font-size: 13px;
  color: #444;
  line-height: 1.65;
  margin-top: 4px;
}

.mob-cv-proj-list {
  font-size: 12px;
  color: var(--gray);
  font-style: italic;
  line-height: 1.6;
  margin-top: 5px;
}

.mob-skills {
  font-size: 14px;
  color: #444;
  line-height: 1.8;
}

.mob-contact-links {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-top: 16px;
}

.mob-contact-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 16px;
  color: var(--ac);
  padding: 16px 0;
  border-bottom: 0.5px solid var(--border);
  cursor: pointer;
}

.mob-contact-link:first-child {
  border-top: 0.5px solid var(--border);
}

/* Contact page */
.mob-contact-content {
  padding: 24px var(--pad) 0;
}

/* Design system page */
.mob-ds-content {
  padding: 24px var(--pad) 0;
}

.mob-ds-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--ac);
  letter-spacing: -0.02em;
  margin-bottom: 24px;
}

.mob-ds-section {
  margin-bottom: 28px;
}

.mob-ds-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--gray);
  margin-bottom: 12px;
}

.mob-ds-swatches {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.mob-ds-swatch {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.mob-ds-swatch-dot {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 0.5px solid rgba(0,0,0,0.1);
}

.mob-ds-swatch-name {
  font-size: 10px;
  color: var(--gray);
  text-align: center;
}

.mob-ds-type-row {

// ─── Lightbox ───────────────────────────────────────────────────────────────
function Lightbox({ images, index, onClose, onNav }) {
  const img = images[index];
  const touchStartX = useRef(null);

  const handleTouchStart = (e) => {
    touchStartX.current = e.touches[0].clientX;
  };

  const handleTouchEnd = (e) => {
    if (touchStartX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    if (Math.abs(dx) > 40) {
      if (dx < 0 && index < images.length - 1) onNav(1);
      else if (dx > 0 && index > 0) onNav(-1);
    }
    touchStartX.current = null;
  };

  return (
    <div
      className="mob-lightbox"
      onTouchStart={handleTouchStart}
      onTouchEnd={handleTouchEnd}
    >
      <button className="mob-lightbox-close" onClick={onClose}>✕</button>
      {index > 0 && (
        <button className="mob-lightbox-nav prev" onClick={() => onNav(-1)}>‹</button>
      )}
      {index < images.length - 1 && (
        <button className="mob-lightbox-nav next" onClick={() => onNav(1)}>›</button>
      )}
      <img
        className="mob-lightbox-img"
        src={img.src}
        alt={img.caption}
      />
      {img.caption && (
        <div className="mob-lightbox-caption">{img.caption}</div>
      )}
    </div>
  );
}

  const nextIdx = (idx + 1) % n;

  const nextProj = PROJECTS[nextIdx];

  const moreWork = useMemo(() => getMoreWork(slug), [slug]);

  const HEADER_H = condensed ? 52 : 72;

  return (

          <div className="mob-proj-title">{proj.title}</div>

        <div className="mob-proj-meta" style={{ color: catColor }}>

              {proj.whatIDid.map((item, i) => <li key={i}>{item}</li>)}

    { key: 'green', color: '#0aa17a' },
    { key: 'violet', color: '#8b5cf6' },
    { key: 'orange', color: '#f4660b' },
  ];

  return (
    <div className="tweaks-panel">
      <div className="tweaks-title">Tweaks</div>

      <div className="tweaks-group">
        <div className="tweaks-group-label">Buttons</div>
        <div className="tweaks-sub-label" style={{ marginTop: 0 }}>Style</div>
        <div className="tweaks-pill-group">
          <button
            className={`tweaks-pill${tweaks.btnStyle === 'text' ? ' active' : ''}`}
            onClick={() => onChange({ ...tweaks, btnStyle: 'text' })}
          >Text</button>
          <button
            className={`tweaks-pill${tweaks.btnStyle === 'outline' ? ' active' : ''}`}
            onClick={() => onChange({ ...tweaks, btnStyle: 'outline' })}
          >Outline</button>
        </div>
        <div className="tweaks-sub-label">Align</div>
        <div className="tweaks-pill-group">
          <button
            className={`tweaks-pill${tweaks.btnAlign === 'left' ? ' active' : ''}`}
            onClick={() => onChange({ ...tweaks, btnAlign: 'left' })}
          >Left</button>
          <button
            className={`tweaks-pill${tweaks.btnAlign === 'right' ? ' active' : ''}`}
            onClick={() => onChange({ ...tweaks, btnAlign: 'right' })}
          >Right</button>
        </div>
      </div>

      <div className="tweaks-divider" />

      <div className="tweaks-group">
        <div className="tweaks-group-label">Color</div>
        <div className="tweaks-sub-label" style={{ marginTop: 0 }}>Accent</div>
        <div className="tweaks-swatches">
          {accentOptions.map(opt => (
            <button
              key={opt.key}
              className={`tweaks-swatch${tweaks.accent === opt.key ? ' selected' : ''}`}
              style={{ background: opt.color }}
              onClick={() => onChange({ ...tweaks, accent: opt.key })}
              title={opt.key}
            />
          ))}
        </div>
      </div>

      <div className="tweaks-divider" />

      <div className="tweaks-group">
        <div className="tweaks-toggle-row">
          <span className="tweaks-toggle-label">Category color-coding</span>
          <button
            className={`tweaks-switch${tweaks.catColor ? ' on' : ''}`}
            onClick={() => onChange({ ...tweaks, catColor: !tweaks.catColor })}
          />
        </div>
      </div>

      <div className="tweaks-group" style={{ marginBottom: 0 }}>
        <div className="tweaks-toggle-row">
          <span className="tweaks-toggle-label">Colorful featured titles</span>
          <button
            className={`tweaks-switch${tweaks.colorfulTitles ? ' on' : ''}`}
            onClick={() => onChange({ ...tweaks, colorfulTitles: !tweaks.colorfulTitles })}
          />
        </div>
      </div>
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('home');
  const [slug, setSlug] = useState('');
  const [menuOpen, setMenuOpen] = useState(false);
  const [scrollTop, setScrollTop] = useState(0);
  const [lightbox, setLightbox] = useState(null);
  const [tweaks, setTweaks] = useState({
    btnStyle: 'text',
    btnAlign: 'left',
    accent: 'blue',
    catColor: false,
    colorfulTitles: false,
  });

  const scrollRef = useRef(null);

  const accentColor = ACCENT_MAP[tweaks.accent] || '#2b6cff';

  const go = useCallback((target, newSlug) => {
    if (target === 'work') {
      setScreen('home');
      setSlug('');
      setMenuOpen(false);
      setTimeout(() => {
        const container = scrollRef.current;
        if (container) {
          const el = container.querySelector('#mob-allwork');
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        }
      }, 80);
      return;
    }
    setScreen(target);
    setSlug(newSlug || '');
    setMenuOpen(false);
    setScrollTop(0);
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
    setLightbox(null);
  }, []);

  const handleScroll = useCallback((e) => {
    setScrollTop(e.target.scrollTop);
  }, []);

  const handleLightbox = useCallback((images, index) => {
    setLightbox({ images, index });
  }, []);

  const closeLightbox = useCallback(() => setLightbox(null), []);

  const navLightbox = useCallback((dir) => {
    setLightbox(lb => {
      if (!lb) return null;
      const newIndex = Math.max(0, Math.min(lb.images.length - 1, lb.index + dir));
      return { ...lb, index: newIndex };
    });
  }, []);

  const totalHeight = scrollRef.current ? scrollRef.current.scrollHeight : 1;
  const containerHeight = scrollRef.current ? scrollRef.current.clientHeight : 1;

  // CSS custom properties update
  const mobStyle = {
    '--tw-accent': accentColor,
  };

  return (
    <div id="root-inner" style={{ display: 'flex', justifyContent: 'center', alignItems: 'flex-start', gap: 32 }}>
      {/* iPhone Frame */}
      <div className="iphone-frame">
        <div className="iphone-screen">
          {/* Dynamic island */}
          <div className="dynamic-island" />

          {/* Mob app */}
          <div className="mob" style={mobStyle}>
            {/* Overlay menu */}
            <SlideMenu
              open={menuOpen}
              screen={screen}
              onClose={() => setMenuOpen(false)}
              onGo={go}
            />

            {/* Lightbox */}
            {lightbox && (
              <Lightbox
                images={lightbox.images}
                index={lightbox.index}
                onClose={closeLightbox}
                onNav={navLightbox}
              />
            )}

            {/* Scrollable container */}
            <div
              className="mob-page"
              ref={scrollRef}
              onScroll={handleScroll}
              style={{ top: 58, paddingBottom: 20 }}
            >
              {/* Sticky header inside scroll container */}
              <MobHeader
                scrollTop={scrollTop}
                screen={screen}
                totalHeight={totalHeight}
                containerHeight={containerHeight}
                onMenuOpen={() => setMenuOpen(true)}
                accentColor={accentColor}
              />

              {/* Screen content */}
              {screen === 'home' && (
                <HomeScreen
                  tweaks={tweaks}
                  accentColor={accentColor}
                  onGo={go}
                />
              )}
              {screen === 'project' && (
                <ProjectScreen
                  slug={slug}
                  scrollTop={scrollTop}
                  scrollRef={scrollRef}
                  tweaks={tweaks}
                  accentColor={accentColor}
                  onGo={go}
                  onLightbox={handleLightbox}
                />
              )}
              {screen === 'about' && (
                <AboutScreen accentColor={accentColor} onGo={go} />
              )}
              {screen === 'contact' && (
                <ContactScreen accentColor={accentColor} onGo={go} />
              )}
              {screen === 'ds' && (
                <DSScreen tweaks={tweaks} accentColor={accentColor} onGo={go} />
              )}
            </div>

            {/* Home indicator */}
            <div className="home-indicator" />
          </div>
        </div>
      </div>

      {/* Tweaks panel */}
      <TweaksPanel tweaks={tweaks} onChange={setTweaks} />
    </div>
  );
}

const container = document.getElementById('root');
const reactRoot = ReactDOM.createRoot(container);
reactRoot.render(<App />);
</script>
</body>
</html>
